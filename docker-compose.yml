version: "3.9"

services:
  # ── PostgreSQL with pgvector extension ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nova:nova@postgres:5432/nova
      DATABASE_URL_SYNC: postgresql://nova:nova@postgres:5432/nova
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./backend/app:/app/app  # Hot-reload for development
      - /var/run/docker.sock:/var/run/docker.sock  # For sandbox container management
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src  # Hot-reload for development
    depends_on:
      - backend

  # ── Isolated Code Execution Sandbox ──
  # This image is built once; the backend spawns ephemeral containers from it.
  sandbox:
    build:
      context: ./infra/sandbox
      dockerfile: Dockerfile
    image: nova-sandbox:latest
    container_name: nova-sandbox-build
    # This container exits immediately — it only exists so docker-compose builds the image.
    entrypoint: ["echo", "Sandbox image built successfully"]

volumes:
  pgdata:
    driver: local
